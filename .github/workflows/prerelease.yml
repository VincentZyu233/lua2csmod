name: 构建预发布版本

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lua2cs-prerelease
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} 测试
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 恢复依赖
        run: dotnet restore Lua2CS.sln

      - name: 运行测试
        run: dotnet test Lua2CS.sln --configuration Release --no-restore

  publish:
    name: 构建并发布双平台安装包
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 恢复双平台依赖
        run: dotnet restore src/Lua2CS/Lua2CS.csproj

      - name: 打包 Linux x64 和 Windows x64 插件
        run: ./package.sh --no-restore

      - name: 替换预发布版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh release delete preview --cleanup-tag --yes
          fi
          gh release create preview \
            artifacts/Lua2CS-preview-linux-x64.zip \
            artifacts/Lua2CS-preview-win-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Lua2CS 预发布版本" \
            --notes "由提交 $GITHUB_SHA 自动构建。" \
            --prerelease \
            --latest=false
